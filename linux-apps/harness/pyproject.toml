[project]
name = "harness"
version = "0.1.0"
description = "板上语音对话 demo：麦克风拾音 → ASR → LLM → TTS 播放，带 web 配置台"
requires-python = ">=3.10"
dependencies = [
    # 对话 SDK（LLM 流式、MCP 工具、TTS）。不在 PyPI 上，见下面的 tool.uv.sources；
    # 在板子上它就是 ~/src/aichat_sdk，也可以改用 { path = "../aichat_sdk" }。
    "dai-chat",
    # web 配置台（改配置 / 看 llm.messages）。
    "starlette>=0.37",
    "uvicorn>=0.29",
    # 代理 asr-server 的录音文件下载（同源 /audio 路由）。
    "httpx>=0.27",
    # 拾音/放音走 sounddevice（系统要有 libportaudio2），PCM 处理用 numpy。
    "sounddevice>=0.5",
    "numpy>=1.24",
    "python-dotenv>=1.0.0",
]

# main.py / server.py 平铺在本目录，以本目录为工作目录直接 uv run main.py，
# 不需要把自身装进环境。
[tool.uv]
package = false

[tool.uv.sources]
dai-chat = { git = "ssh://git@gitee.com/fa0/aichat_sdk.git" }
