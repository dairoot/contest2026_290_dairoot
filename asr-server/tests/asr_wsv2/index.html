<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>实时说话人识别（板载麦克风）</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #222; }
    h2 { margin-bottom: 12px; }
    .toolbar { display: flex; align-items: center; gap: 12px; }
    button { padding: 10px 22px; font-size: 15px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    #status { color: #6b7280; font-size: 14px; }
    #log { margin-top: 20px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px; min-height: 360px; max-height: 60vh; overflow-y: auto; background: #fafafa; }
    .line { padding: 8px 0; border-bottom: 1px dashed #eee; line-height: 1.5; }
    .line:last-child { border-bottom: 0; }
    .spk { color: #2563eb; font-weight: 600; margin-right: 8px; }
    button.play { display: inline-flex; align-items: center; justify-content: center; padding: 0; width: 22px; height: 22px; border-radius: 50%; background: #e0e9ff; color: #2563eb; margin-right: 8px; vertical-align: middle; }
    button.play:disabled { background: #f3f4f6; color: #9ca3af; }
    .ts { color: #9ca3af; font-size: 12px; margin-right: 8px; }
    .elapsed { color: #9ca3af; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>
  <h2>实时说话人识别（板载麦克风）</h2>
  <div class="toolbar">
    <span id="status">连接中...</span>
  </div>
  <div id="log"></div>

<script>
const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;

const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

function nowHMS() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

let playing = null; // { audio, btn }

// 坐标即 22px 按钮内的像素；三角形按质心（而非包围盒）落在圆心，视觉上才是正的。
const ICON_PLAY = '<svg viewBox="0 0 22 22" width="22" height="22" fill="currentColor"><path d="M8.2 6L16.6 11L8.2 16Z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 22 22" width="22" height="22" fill="currentColor"><path d="M7.3 6h2.6v10H7.3zM12.1 6h2.6v10H12.1z"/></svg>';

function stopPlaying() {
  if (!playing) return;
  playing.audio.pause();
  playing.btn.innerHTML = ICON_PLAY;
  playing = null;
}

function makePlayButton(audioUrl) {
  const btn = document.createElement('button');
  btn.className = 'play';
  btn.innerHTML = ICON_PLAY;
  if (!audioUrl) {
    btn.disabled = true;
    btn.title = '无音频';
    return btn;
  }
  btn.title = '播放录音';
  btn.addEventListener('click', () => {
    if (playing && playing.btn === btn) { stopPlaying(); return; }
    stopPlaying();
    const audio = new Audio(audioUrl);
    const reset = () => { if (playing && playing.audio === audio) stopPlaying(); };
    audio.addEventListener('ended', reset);
    audio.addEventListener('error', () => { setStatus('音频加载失败'); reset(); });
    playing = { audio, btn };
    btn.innerHTML = ICON_PAUSE;
    audio.play().catch(err => { console.error(err); reset(); });
  });
  return btn;
}

function appendLine(speaker, content, elapsed, audioUrl) {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = `<span class="ts"></span><span class="spk"></span><span class="txt"></span><span class="elapsed"></span>`;
  div.prepend(makePlayButton(audioUrl));
  div.querySelector('.ts').textContent = nowHMS();
  div.querySelector('.spk').textContent = speaker + ':';
  div.querySelector('.txt').textContent = content;
  if (typeof elapsed === 'number' && !Number.isNaN(elapsed)) {
    div.querySelector('.elapsed').textContent = `耗时 ${Math.round(elapsed * 1000)} ms`;
  }
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text) {
  statusEl.textContent = text;
}

// 采集在板子上一直跑，页面只是个观察窗：连上就先收到已有结果，之后实时追加。
const ws = new WebSocket(WS_URL);
ws.onopen = () => setStatus('聆听中（板载麦克风）');
ws.onmessage = (e) => {
  try {
    const data = JSON.parse(e.data);
    if (data.type === 'error') { setStatus(data.message); return; }
    appendLine(data.speaker, data.content, data.elapsed, data.audio_url);
  } catch (err) {
    console.error('bad msg', err);
  }
};
ws.onclose = () => setStatus('已断开');
ws.onerror = (e) => { console.error(e); setStatus('连接错误'); };
</script>
</body>
</html>
